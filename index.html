/* ---------- Aktionskarten vor dem Würfeln ---------- */
async function runChooser(card, pid) {
  const def = cardDef(card.id);
  const room = state.room;
  const ids = orderOf(room), others = ids.filter(id => id !== pid), me = room.players[pid];
  const patch = {};
  const done = { ...card, status: 'done' };
  let result = '', fxKind = 'good', target = null;
  const strike = (tid, cat) => {
    const t = room.players[tid]; const v = (t.scores || {})[cat] || 0;
    P(patch, tid).scores = { ...(P(patch, tid).scores || {}), [cat]: 0 };
    P(patch, tid).cfx = { ...(P(patch, tid).cfx || {}), [cat]: '⚔️' };
    P(patch, tid).xk = { ...(P(patch, tid).xk || {}), [cat]: null };
    if (tid !== pid) P(patch, tid).lastAttacker = pid;
    if (v > 0) chestIn(patch, room, v, tid, 'gestrichen');
    return v;
  };
  const pickOpp = (q, filter) => stageAsk(q, others.filter(filter).map(id => ({ v: id, label: esc(nameOf(room, id)) })));
  const pickScore = (q, tid) => stageAsk(q, attackable(room.players[tid]).filter(c => !(P(patch, tid).scores || {}).hasOwnProperty(c.id)).map(c => ({ v: c.id, label: `${catLbl(c.id)} · ${room.players[tid].scores[c.id]}`, small: true })));

  switch (def.act) {
    case 'bet': {
      const stake = await stageAsk('💸 Wie viel setzt du, Süße?', [50, 60, 70, 80, 90, 100].map(v => ({ v, label: `${v}` })));
      const cats = emptyCats(me).map(c => c.id).sort(() => Math.random() - .5).slice(0, 3);
      done.bet = { stake, cats }; result = `Einsatz ${stake} auf ${cats.map(catLbl).join(', ')}`;
      break;
    }
    case 'forceOwn': case 'forceOpp': {
      const q = def.act === 'forceOwn' ? '📌 Auf welche Kategorie legst du dich fest?' : '👯‍♀️ Gib das Handy einer Mitspielerin – sie wählt deine Kategorie:';
      const cat = await stageAsk(q, emptyCats(me).map(c => ({ v: c.id, label: catLbl(c.id), small: true })), true);
      done.forceCat = cat; result = `Festgelegt: ${catLbl(cat)} (×3 wenn geschafft)`;
      break;
    }
    case 'oppScore': {
      const tid = await pickOpp('⚔️ Wen erwischt es? 😈', id => attackable(room.players[id]).length); target = tid;
      const cat = await pickScore(`Welche Wertung von ${esc(nameOf(room, tid))} streichst du?`, tid);
      const v = strike(tid, cat); result = `${nameOf(room, tid)} verliert ${catLbl(cat)} (${v})!`; fxKind = 'attack';
      break;
    }
    case 'ownStruck': {
      const cat = await stageAsk('🧽 Welche Kategorie machst du wieder frei?', struckCats(me).map(c => ({ v: c.id, label: catLbl(c.id), small: true })));
      P(patch, pid).scores = { [cat]: null }; P(patch, pid).cfx = { [cat]: null }; P(patch, pid).marks = { [cat]: null }; P(patch, pid).xk = { [cat]: null };
      result = `${catLbl(cat)} ist wieder frei! 💕`;
      break;
    }
    case 'revive': {
      const cat = await stageAsk('🧚 Welche gestrichene Kategorie belebst du wieder?', struckCats(me).map(c => ({ v: c.id, label: catLbl(c.id), small: true })));
      P(patch, pid).scores = { [cat]: 40 }; P(patch, pid).cfx = { [cat]: '🧚' };
      result = `${catLbl(cat)}: 40 Punkte! 🧚`;
      break;
    }
    case 'swap': {
      const common = id => ALL.filter(c => isNum((me.scores || {})[c.id]) && isNum((room.players[id].scores || {})[c.id]) && !isProt(me, c.id) && !isProt(room.players[id], c.id));
      const tid = await pickOpp('🔄 Mit wem tauschst du?', id => common(id).length); target = tid;
      const t = room.players[tid];
      const cat = await stageAsk('Welche Kategorie tauscht ihr?', common(tid).map(c => ({ v: c.id, label: `${catLbl(c.id)} · ${me.scores[c.id]} ↔ ${t.scores[c.id]}`, small: true })), true);
      P(patch, pid).scores = { [cat]: t.scores[cat] }; P(patch, tid).scores = { [cat]: me.scores[cat] };
      P(patch, pid).cfx = { [cat]: '🔄' }; P(patch, tid).cfx = { [cat]: '🔄' }; P(patch, tid).lastAttacker = pid;
      result = `${catLbl(cat)} getauscht: ${me.scores[cat]} ↔ ${t.scores[cat]}`;

      P(patch, pid).scores = { [own]: 0 }; P(patch, pid).cfx = { [own]: '🕯️' };
      const tid = await pickOpp('Bei wem streichst du 2 Wertungen? 😈', id => attackable(room.players[id]).length); target = tid;
      const c1 = await pickScore(`Erste Wertung von ${esc(nameOf(room, tid))}:`, tid); const v1 = strike(tid, c1);
      let txt = `${catLbl(c1)} (${v1})`;
      if (attackable(room.players[tid]).filter(c => c.id !== c1).length) { const c2 = await pickScore('Und die zweite:', tid); const v2 = strike(tid, c2); txt += ` und ${catLbl(c2)} (${v2})`; }
      result = `${nameOf(room, pid)} opfert ${catLbl(own)} – ${nameOf(room, tid)} verliert ${txt}!`; fxKind = 'attack';
      break;
    }
    case 'dieduel': {

        const tid = await pickOpp(`Gerade (${v})! Bei wem streichst du? 😈`, id => attackable(room.players[id]).length); target = tid;
        const cat = await pickScore('Welche Wertung?', tid); const sv = strike(tid, cat);
        result = `Gerade ${v}: ${nameOf(room, tid)} verliert ${catLbl(cat)} (${sv})!`; fxKind = 'attack';
      } else {
        const free = emptyCats(me).length > 1 ? emptyCats(me) : [];
        if (!free.length) { done.forfeit = true; result = `Ungerade (${v}) – nichts zu streichen. Karte verfällt → ×4!`; break; }
        const cat = await stageAsk(`Ungerade (${v}) 🙊 Welche eigene freie Kategorie streichst du?`, free.map(c => ({ v: c.id, label: catLbl(c.id), small: true })));
        P(patch, pid).scores = { [cat]: 0 }; P(patch, pid).cfx = { [cat]: '🎲' };
        result = `Ungerade ${v}: ${nameOf(room, pid)} streicht ${catLbl(cat)}`; fxKind = 'bad';
      }

      const cat = await pickScore(`🐍 Rache an ${esc(nameOf(room, tid))}! Welche Wertung streichst du?`, tid); const v = strike(tid, cat);

    }
    case 'deed': {
      const opts = others.map(id => ({ v: id, label: `💝 ${esc(nameOf(room, id))}` })).concat([{ v: '', label: 'Niemandem 🙅‍♀️', cls: 'ghost' }]);
      const tid = await stageAsk(def.give ? '😇 Wem schenkst du 50 Punkte?' : '🎀 Wem schenkst du 15 aufs Bonus-Konto?', opts);
      if (tid) {
        target = tid; done.deed = true;
        if (def.give) addExtra(patch, room, tid, def.give); else P(patch, tid).upAdj = ((room.players[tid].upAdj) || 0) + def.giveUp;
        result = `${nameOf(room, tid)} bekommt ${def.give ? '+50 Punkte' : '+15 aufs Bonus-Konto'} – dein Wurf zählt ×${def.dmult} 😇`;
      } else result = 'Niemand bekommt etwas – dein Wurf zählt normal.';
      break;
    }
  }
  done.result = result;
  patch.turn = { card: done };
  const ev = { type: 'card', phase: 'result', pid, target, card: card.id, result, fx: fxKind };
  addLog(patch, room, ev); state.seen.add(ev.id);
  if (!(await write(() => state.backend.updateRoom(state.session.code, patch)))) return;
  playCardResult(ev);
  const front = $('#cardlayer .face.front'); if (front) front.innerHTML = cardFaceHTML(done, pid);
  stageInfo(`<button class="btn shine" data-cact="close">Los geht's! 💖</button>`);
  const box = $('#cardlayer .cl-actions'); if (box) box.onclick = e => { if (e.target.closest('[data-cact]')) closeCardLayer(); };
}

async function entryFlow(pid, catId, val, xk) {
  const room = state.room;
  const p = room.players[pid];
  const turn = turnOf(room);
  const isTurn = turn.pid === pid;
  const card = isTurn ? turn.card : null;
  const def = card ? cardDef(card.id) : null;
  const patch = {};
  const me = P(patch, pid);
  const preLog = [];   // Ereignisse, die die Schreiberin schon live gesehen hat
  let lost = 0, cfx = null, writeCat = catId, notes = [];

  // Leeren
  if (val === null) {
    me.scores = { [catId]: null }; me.marks = { [catId]: null }; me.xk = { [catId]: null }; me.cfx = { [catId]: null };
    if (isTurn) patch.turn = { choosing: null };
    await write(() => state.backend.updateRoom(state.session.code, patch));
    return;
  }

  const mulVal = (m, label) => {
    if (val <= 0 || m === 1) return;
    const nv = m < 1 ? Math.floor(val * m) : Math.round(val * m);
    if (nv < val) lost += val - nv;
    val = nv; cfx = cfx ? cfx + ' ' + label : label;
  };

  // Pechsträhne aus einem früheren Zug
  if (p.nextHalf && val > 0) { mulVal(0.5, '🌧️½'); me.nextHalf = null; notes.push('Pechsträhne: halbiert'); }
  else if (p.nextHalf) me.nextHalf = null;

  const needStage = def && (card.hidden || def.cost || def.doubleOrNothing);
  if (needStage) openStage(card, pid, !!card.hidden);

  if (def && !card.hidden) {
    let m = 1, lbl = [];
    if (card.forfeit) { m *= 4; lbl.push('×4'); }
    else {
      if (def.mult && (!def.dmult)) { m *= def.mult; lbl.push(def.mult < 1 ? '½' : '×' + def.mult); }
      if (def.dmult && card.deed) { m *= def.dmult; lbl.push('×' + def.dmult); }
      if (def.goldFixed && ALL.find(c => c.id === catId).type === 'fixed') { m *= def.goldFixed; lbl.push('🏆×' + def.goldFixed); }
      if (def.kmult && ['k5', 'k6'].includes(catId)) { m *= def.kmult; lbl.push('×' + def.kmult); }
      if (card.forceCat && card.forceCat === catId && val > 0) { m *= 3; lbl.push('📌×3'); }
    }
    if (val > 0 && m !== 1) mulVal(m, lbl.join(''));
    if (def.kmult && xk) xk *= def.kmult;
    if (def.cost) {
      const n = await stageAsk(`💳 ${def.title}: Wie oft hast du gewürfelt?`, [1, 2, 3, 4, 5].map(v => ({ v, label: `${v}×` })));
      const c = (n - 1) * def.cost; const nv = Math.max(0, val - c);
      if (c > 0) { lost += val - nv; val = nv; cfx = (cfx ? cfx + ' ' : '') + `💳−${c}`; notes.push(`${n} Würfe: −${c}`); }
    }
    if (def.master && ((['hw', 'k5', 'k6'].includes(catId) && val > 0) || xk)) { addExtra(patch, room, pid, def.master); notes.push('🎯 Meisterwurf +100'); }
    if (def.mission && card.cat === catId && val > 0) { addExtra(patch, room, pid, def.mission); notes.push(`🧚 Auftrag +${def.mission}`); }
    if (card.bet) {
      if (card.bet.cats.includes(catId) && val > 0) { addExtra(patch, room, pid, card.bet.stake); notes.push(`💸 Wette gewonnen +${card.bet.stake}`); }
      else {
        const free = card.bet.cats.filter(c => c !== catId && !isNum((p.scores || {})[c]));
        if (free.length) { const c = pick(free); me.scores = { ...(me.scores || {}), [c]: -card.bet.stake }; me.cfx = { ...(me.cfx || {}), [c]: '💸' }; notes.push(`💸 Wette verloren: −${card.bet.stake} bei ${catLbl(c)}`); }
        else { addExtra(patch, room, pid, -card.bet.stake); notes.push(`💸 Wette verloren −${card.bet.stake}`); }
      }
    }
    if (def.doubleOrNothing && val > 0) {
      const go = await stageAsk(`🎲 Doppelt oder nichts? Du hast ${val} Punkte.`, [{ v: 1, label: '🎲 Ich wag\'s!', cls: 'shine' }, { v: 0, label: 'Lieber nicht 🙈' }]);
      if (go) {
        const r = await stageRoll(pid, 'Doppelt oder nichts'); preLog.push({ type: 'roll', pid, label: 'Doppelt oder nichts', rolls: [[pid, r]] });
        if (r <= 3) { lost += val; val = 0; cfx = '🎲✗'; notes.push(`🎲 ${r}: alles weg!`); } else { val *= 2; cfx = (cfx ? cfx + ' ' : '') + '🎲×2'; notes.push(`🎲 ${r}: doppelt!`); }
      }
    }
  }

  // Verdeckte Karte: erst jetzt aufdecken
  let rescue = false, revealResult = '';
  if (def && card.hidden) {
    await flipReveal(card, pid);
    preLog.push({ type: 'card', phase: 'reveal', pid, card: card.id, roast: card.roast || 0, cheer: card.cheer || 0 });
    const others = orderOf(room).filter(id => id !== pid);
    switch (def.hidden) {
      case 'rescue': if (val === 0) { rescue = true; revealResult = '🛟 Gerettet – der ganze Zug wird wiederholt!'; } else revealResult = 'Nicht gebraucht – du hast ja gepunktet 💖'; break;
      case 'void': lost += val; revealResult = `${catLbl(catId)} wird gestrichen 🥀`; val = 0; cfx = '🥀'; break;
      case 'fate': {
        const r = await stageRoll(pid, 'Schicksalswürfel'); preLog.push({ type: 'roll', pid, label: 'Schicksalswürfel', rolls: [[pid, r]] });
        if (r === 1) { lost += val; val = 0; cfx = '🔮✗'; revealResult = '1 – gestrichen! 💔'; }
        else if (r <= 3) revealResult = `${r} – zählt normal`;
        else { const m = r === 6 ? 10 : 5; mulVal(m, `🔮×${m}`); revealResult = `${r} – ×${m}! 🔮`; }
        break;
      }
      case 'jackpot': if (val >= 40) { mulVal(2, '💰×2'); revealResult = 'Jackpot! Doppelt! 💰'; } else revealResult = 'Unter 40 – leider kein Jackpot'; break;
      case 'consol': if (val === 0) { addExtra(patch, room, pid, 20); revealResult = 'Trostpreis: +20 🧸'; } else revealResult = 'Kein Trostpreis nötig 💅'; break;
      case 'mirror': if (val === 0) { val = normalVal(catId); cfx = '🪞'; revealResult = `Spiegelung: ${val} Punkte geschenkt! 🪞`; } else revealResult = 'Keine 0 – die Spiegelung bleibt still'; break;
      case 'roundup': { const nv = Math.floor(val / 10) * 10 + 10; revealResult = `${val} → ${nv} ⬆️`; val = nv; cfx = '⬆️'; break; }
      case 'rounddown': { const nv = val > 0 ? Math.floor((val - 1) / 10) * 10 : 0; lost += val - nv; revealResult = `${val} → ${nv} ⬇️`; val = nv; cfx = '⬇️'; break; }
      case 'face': {
        const n = await stageAsk(`Wie viele ${def.face}er lagen nach deinem letzten Wurf? ${die(def.face, 'die tiny')}`, [0, 1, 2, 3, 4, 5, 6].map(v => ({ v, label: `${v}` })));
        if (n > 0 && val > 0) { const before = val; mulVal(Math.pow(def.ffx, n), def.ffx < 1 ? `${def.face}️⃣½^${n}` : `${def.face}️⃣×${Math.pow(2, n)}`); revealResult = `${n}× die ${def.face}: ${before} → ${val}`; }
        else revealResult = n ? 'Wertung war 0 – nichts passiert' : `Keine ${def.face} – Glück gehabt!`;
        break;
      }
      case 'pioneer': {
        const first = !others.some(id => ((room.players[id].scores || {})[catId] || 0) > 0);
        if (first && val > 0) { addExtra(patch, room, pid, 20); revealResult = 'Du bist die Erste: +20 🚩'; }
        else { addExtra(patch, room, pid, -20); chestIn(patch, room, 20, pid, 'Pionierin'); revealResult = 'Nicht die Erste: −20'; }
        break;
      }
      case 'thief': {
        if (val > 0 && others.length) {
          const tid = await stageAsk(`🦝 Wer verliert ${val} Punkte?`, others.map(id => ({ v: id, label: esc(nameOf(room, id)) })));
          addExtra(patch, room, tid, -val); P(patch, tid).lastAttacker = pid; chestIn(patch, room, val, tid, 'Punktedieb');
          revealResult = `${nameOf(room, tid)} verliert ${val} Punkte! 🦝`;
        } else revealResult = 'Nichts zu klauen';
        break;
      }
      case 'gift': {
        if (val > 0 && others.length) {
          const tid = await stageAsk(`🎁 Wer bekommt deine ${val} Punkte?`, others.map(id => ({ v: id, label: esc(nameOf(room, id)) })));
          addExtra(patch, room, tid, val); revealResult = `${nameOf(room, tid)} bekommt ${val} Punkte 🎁`; val = 0; cfx = '🎁';
        } else revealResult = 'Nichts zu verschenken';
        break;
      }
      case 'share': {
        if (val > 0) { const give = Math.min(val, others.length * 10); others.forEach(id => addExtra(patch, room, id, 10)); revealResult = `Alle anderen bekommen +10 🍰`; val = Math.max(0, val - others.length * 10); cfx = '🍰'; if (give < others.length * 10) {} }
        else revealResult = 'Nichts zu teilen';
        break;
      }
      case 'mixup': {
        const free = emptyCats(p).filter(c => c.id !== catId);
        if (free.length) {
          const tc = pick(free); writeCat = tc.id;
          let nv = 0;
          if (tc.type === 'fixed') nv = (await stageAsk(`🌀 Deine Wertung landet bei ${catLbl(tc.id)}! Passt dein Wurf dazu?`, [{ v: tc.pts, label: `Ja, passt! (${tc.pts})`, cls: 'shine' }, { v: 0, label: 'Passt nicht (0)' }]));
          else if (tc.type === 'upper') nv = (await stageAsk(`🌀 Deine Wertung landet bei ${catLbl(tc.id)}! Wie viele ${tc.face}er hattest du?`, [0, 1, 2, 3, 4, 5, 6].map(n => ({ v: n * tc.face, label: `${n}× = ${n * tc.face}` }))));
          else { const f = tc.type === 'double' ? 2 : 1; nv = await stageAsk(`🌀 Deine Wertung landet bei ${catLbl(tc.id)}! Augensumme deiner Würfel?`, [{ v: 0, label: 'Passt nicht (0)' }].concat(Array.from({ length: 31 }, (_, i) => ({ v: (i + 6) * f, label: `${i + 6}` })))); }
          revealResult = `Gelandet bei ${catLbl(tc.id)}: ${nv}`; val = nv; cfx = '🌀';
        } else revealResult = 'Kein anderes Feld frei – alles bleibt';
        break;
      }
      case 'wheel': {
        const idx = Math.floor(Math.random() * WHEEL.length);
        await animateWheel($('#cardlayer .cl-actions'), idx); preLog.push({ type: 'wheel', pid, idx });
        const w = WHEEL[idx];
        if (w === '×2') mulVal(2, '🎡×2'); else { val += Number(w.slice(1)); cfx = '🎡' + w; }
        revealResult = `Glücksrad: ${w}! 🎡`;
        break;
      }
      case 'slot': {
        const res = [pick(SLOT), pick(SLOT), pick(SLOT)];
        await animateSlot($('#cardlayer .cl-actions'), res); preLog.push({ type: 'slot', pid, res });
        const start = val;
        res.forEach(r => { if (r === '+25') val += 25; else val *= Number(r.slice(1)); });
        cfx = '🎰'; revealResult = `${res.join(' ')}: ${start} → ${val} 🎰`;
        break;
      }
      case 'streak': me.nextHalf = true; revealResult = 'Deine NÄCHSTE Wertung zählt nur halb 🌧️'; break;
    }
    notes.unshift(revealResult);
  }

  // Zusammenbauen
  const before = calc(p);
  if (rescue) {
    patch.turn = { choosing: null, card: { id: 'retry', key: rid(), ts: Date.now(), status: 'done' } };
  } else {
    me.scores = { ...(me.scores || {}), [writeCat]: val };
    me.marks = { [writeCat]: null };
    me.xk = { [writeCat]: xk || null };
    me.cfx = { ...(me.cfx || {}), [writeCat]: cfx };
    if (card && card.forceCat && writeCat !== card.forceCat) {} // Pflicht/Zwang: Picker lässt nur dieses Feld zu
  }
  if (lost > 0) chestIn(patch, room, lost, pid, cardDef(card ? card.id : 'calm') ? (card ? cardDef(card.id).title : '') : '');
  preLog.forEach(e => { addLog(patch, room, e); state.seen.add(e.id); });
  if (!rescue) {
    const after = calc({ ...p, scores: { ...(p.scores || {}), ...(me.scores || {}) }, xk: { ...(p.xk || {}), [writeCat]: xk || null } });
    addLog(patch, room, { type: 'entry', pid, cat: writeCat, val, xk: xk || 0, cfx, notes, bonus: !before.bonus && !!after.bonus });
    if (card && def && card.hidden) patch.turn = { card: { ...card, revealed: true, result: revealResult } };
    if (isTurn) {
      const nt = nextTurn(room, pid);
      patch.turn = nt;
      bombStep(patch, room, nt.pid);
      maybePayout(patch, room);
    }
  }
  const ok = await write(() => state.backend.updateRoom(state.session.code, patch));
  if (needStage) { if (ok && notes.length) { stageInfo(`<p class="cl-q">${esc(notes.join(' · '))}</p>`); await sleep(1600); } closeCardLayer(); }
}

/* ---------- Zeitbombe ---------- */
function bombStep(patch, room, nextPid) {
  const b = patch.bomb || room.bomb;
  if (!b || !b.pid || !nextPid) return;
  const left = (b.left || 1) - 1;
  if (left <= 0) {
    const victim = b.pid;
    addExtra(patch, room, victim, -50); chestIn(patch, room, 50, victim, 'Zeitbombe');
    patch.bomb = null;
    addLog(patch, room, { type: 'bomb', pid: victim });
  } else patch.bomb = { pid: nextPid, left };
}

// Firebase Realtime Database – gleiche Schnittstelle wie der Claude-Speicher
function flattenPatch(obj, prefix = '', out = {}) {
  for (const [k, v] of Object.entries(obj)) {
    const path = prefix ? `${prefix}/${k}` : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (Object.keys(v).length) flattenPatch(v, path, out);
    } else out[path] = v === undefined ? null : v;
  }
  return out;
}
async function firebaseBackend(cfg) {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const A = await import(base + 'firebase-app.js');
  const D = await import(base + 'firebase-database.js');
  const db = D.getDatabase(A.initializeApp(cfg));
  const ref = code => D.ref(db, 'rooms/' + code);
  let chain = Promise.resolve();
  const serial = fn => (chain = chain.then(fn, fn));
  return {
    mode: 'firebase',
    async getRoom(code) { const s = await D.get(ref(code)); return s.exists() ? clone(s.val()) : null; },
    setRoom: (code, data) => serial(() => D.set(ref(code), clone(data))),
    updateRoom: (code, patch) => serial(() => D.update(ref(code), flattenPatch(clone(patch)))),
    subscribe(code, cb, onErr) {
      return D.onValue(ref(code), s => cb(s.exists() ? clone(s.val()) : null, false), e => onErr && onErr(e));
    }
  };
}

// Test-Backend, das sich exakt wie Firebase verhält (nur lokal, für Vorschau mit ?rtdb)
function rtdbMockBackend() {
  const loc = localBackend();
  const KEY = 'kx-local-db';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const setPathRT = (o, parts, val) => {
    const last = parts.pop();
    for (const k of parts) { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }
    if (val === null) delete o[last]; else o[last] = clone(val);
  };
  return {
    ...loc, mode: 'firebase',
    async updateRoom(code, patch) {
      const d = load(); if (!d[code]) d[code] = {};
      Object.entries(flattenPatch(clone(patch))).forEach(([p, v]) => setPathRT(d[code], p.split('/'), v));
      await loc.setRoom(code, d[code]);
    }
  };
}

async function startGame() {

    status: 'playing',
    turn: { pid: ids[0], choosing: null, n: 0, card: null },

  }));
}

/* ================= Siegerehrung ================= */
const gameOver = room => {
  const ps = playersOf(room || {});
  return room && room.status !== 'lobby' && ps.length > 0 && ps.every(([, p]) => calc(p).filled === ALL.length);
};
const AVATARS = ['💖', '🌸', '🦄', '🎀', '🦋', '👑', '💅', '🌷', '✨', '🍓'];
const avatarOf = (room, pid) => ((room.players[pid] || {}).emoji) || AVATARS[Math.max(0, orderOf(room).indexOf(pid)) % AVATARS.length];

function ceremonyHook(app) {
  const room = state.room;

  ['.turnbar', '#cardchip', '#drawbtn'].forEach(sel => { const el = app.querySelector(sel); if (el) el.remove(); });

  }

  if (state.ceremonyKey !== key) { state.ceremonyKey = key; setTimeout(() => showCeremony(false), (state.fxDelay || 0) + 3200); }
}

function ceremonyData(room) {
  const ps = playersOf(room).map(([id, p]) => ({ id, p, t: calc(p).total }));
  ps.sort((a, b) => b.t - a.t);
  let rank = 0, last = null;
  ps.forEach((x, i) => { if (x.t !== last) { rank = i + 1; last = x.t; } x.rank = rank; });
  const s = x => x.p.scores || {};
  const kn = x => (s(x).k5 > 0 ? 1 : 0) + (s(x).k6 > 0 ? 1 : 0) + Object.values(x.p.xk || {}).filter(v => v > 0).length;
  const best = x => Math.max(0, ...Object.values(s(x)).filter(v => typeof v === 'number'));
  const zeros = x => Object.values(s(x)).filter(v => v === 0).length;
  const award = (fn, emo, title, unit) => {
    const mx = Math.max(...ps.map(fn)); if (mx <= 0) return null;
    const who = ps.filter(x => fn(x) === mx);
    return { emo, title, names: who.map(x => dname(x.p)).join(' & '), val: `${mx} ${unit}` };
  };
  const awards = [
    award(kn, '💎', 'Kniffel-Queen', 'Kniffel'),
    award(best, '🔥', 'Höchster Einzelwurf', 'Punkte'),
    award(x => x.p.extra || 0, '🔮', 'Zauberkarten-Liebling', 'Kartenpunkte'),
    award(zeros, '🥀', 'Streich-Königin', 'gestrichen')
  ].filter(Boolean);
  return { ps, awards };
}

  setTimeout(() => clearInterval(state.cerFw), 6000);

  await sleep(1400); if (cancelled()) return;
  if (ps.length >= 2) {

    el.querySelector('.cer-last').classList.add('show');

function unicornFly(host) {

    const t = document.createElement('span'); t.className = 'rb-trail';
    t.style.left = (r.left + 10) + 'px'; t.style.top = (r.top + r.height * 0.55) + 'px';
    t.textContent = pick(['🌈', '✨', '💖', '⭐']);
    host.appendChild(t); setTimeout(() => t.remove(), 1400);
  }, 70);
  play('magic');
  setTimeout(() => { clearInterval(trail); u.remove(); }, 3300);
}
